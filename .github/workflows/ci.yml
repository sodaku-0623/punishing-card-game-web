name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 仓库包含约 2GB 卡图，CI 只需源码：使用 blob-less + 稀疏检出，跳过卡图与卡表原始素材
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/apps/web/public/cards/
            !/战双帕弥什对战卡牌卡表/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build (shared → game-rules → game-engine → database → server → web)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Lint (web)
        run: npm run lint

      - name: Test
        run: npm test
