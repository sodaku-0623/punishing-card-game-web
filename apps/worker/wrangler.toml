name = "zhanshuang-worker"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# 前端静态文件 (Next.js 静态导出)，由 scripts/build-cf-static.mjs 生成到 ./static。
# 与 API / WebSocket 同域：命中静态文件的请求直接返回且不计 Worker 请求额度，其余请求进入 Worker。
[assets]
directory = "./static"
binding = "ASSETS"
not_found_handling = "404-page"

# 绑定 Durable Object 用于连通性测试 (EchoDO)
[[durable_objects.bindings]]
name = "ECHO_DO"
class_name = "EchoDO"

# 绑定 Durable Object 用于实时对战房间与引擎状态维护 (RoomDO)
[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDO"

# SQLite 存储后端声明（Cloudflare Workers Free 免费套餐兼容）
[[migrations]]
tag = "v1"
new_sqlite_classes = ["EchoDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomDO"]

# 绑定 Cloudflare D1 关系型数据库（持久化用户、卡组、卡牌及战绩）
[[d1_databases]]
binding = "DB"
database_name = "zhanshuang_tcg"
database_id = "136e6810-ce7d-4fe9-8965-c288c9de0755"

# ==========================================
# Worker Previews 预览环境专属绑定 (PR 分支独立 DO 与 D1 存储)
# ==========================================
[previews]

[[previews.durable_objects.bindings]]
name = "ECHO_DO"
class_name = "EchoDO"

[[previews.durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDO"

[[previews.d1_databases]]
binding = "DB"
database_name = "zhanshuang_tcg_preview"
database_id = "f9edd7b8-bfef-4cd8-ae59-57d7427567d1"

