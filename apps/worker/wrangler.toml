name = "zhanshuang-worker"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# 绑定 Durable Object 用于连通性测试 (EchoDO)
[[durable_objects.bindings]]
name = "ECHO_DO"
class_name = "EchoDO"

# 绑定 Durable Object 用于实时对战房间与引擎状态维护 (RoomDO)
[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDO"

# SQLite 存储后端声明（Cloudflare Workers Free 免费套餐兼容）
[[migrations]]
tag = "v1"
new_sqlite_classes = ["EchoDO", "RoomDO"]

# 绑定 Cloudflare D1 关系型数据库（持久化用户、卡组、卡牌及战绩）
[[d1_databases]]
binding = "DB"
database_name = "zhanshuang_tcg"
database_id = "00000000-0000-0000-0000-000000000000"
