name = "zhanshuang-worker"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# 前端静态文件 (Next.js 静态导出)，由 scripts/build-cf-static.mjs 生成到 ./static。
# 与 API / WebSocket 同域：命中静态文件的请求直接返回且不计 Worker 请求额度，其余请求进入 Worker。
[assets]
directory = "./static"
binding = "ASSETS"
not_found_handling = "404-page"

# 绑定 Durable Object 用于连通性测试 (EchoDO)
[[durable_objects.bindings]]
name = "ECHO_DO"
class_name = "EchoDO"

# 绑定 Durable Object 用于实时对战房间与引擎状态维护 (RoomDO)
[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDO"

# SQLite 存储后端声明（Cloudflare Workers Free 免费套餐兼容）
[[migrations]]
tag = "v1"
new_sqlite_classes = ["EchoDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomDO"]

# 绑定 Cloudflare D1 关系型数据库（持久化用户、卡组、卡牌及战绩）
[[d1_databases]]
binding = "DB"
database_name = "zhanshuang_tcg"
database_id = "916fc7de-27c9-42a9-aeda-eb6d73c6df55"
