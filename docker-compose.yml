version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zhanshuang-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: zhanshuang_tcg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: zhanshuang-server
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgres_password@postgres:5432/zhanshuang_tcg?schema=public"
      PORT: 4000
      NODE_ENV: production
      # 请在 .env 或部署环境中设置强随机值；未设置时服务端每次启动随机生成
      JWT_SECRET: "${JWT_SECRET:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 容器内 /api 反向代理需指向 server 服务，而不是 web 容器自身的 127.0.0.1
        API_PROXY_TARGET: "http://server:4000"
    container_name: zhanshuang-web
    restart: always
    environment:
      NEXT_PUBLIC_SERVER_URL: "http://localhost:4000"
      NEXT_PUBLIC_WS_URL: "ws://localhost:4000"
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
    driver: local
